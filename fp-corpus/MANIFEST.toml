# False-Positive Corpus Manifest
#
# This manifest defines the 10 popular open-source repositories used as the
# FP (false-positive) corpus for Sicario's benchmark suite.
#
# These are clean, well-maintained projects that should produce ZERO
# high-confidence findings when scanned by the Sicario SAST engine.
#
# Usage:
#   sicario benchmark --fp-corpus
#
# The benchmark command clones each repository (shallow clone) into a
# temporary directory, runs the full SAST rule set, and asserts that the
# number of `confidence: high` findings is zero for each repository.
#
# Requirement: Req 2 — False-Positive Corpus

